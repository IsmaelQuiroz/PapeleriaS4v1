name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client --legacy-peer-deps
        
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      # 1. Configuramos Node.js en el entorno de GitHub de forma limpia
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Puedes cambiarlo a '16' o '20' según requiera tu proyecto

      # 2. Instalamos las dependencias saltando el error ERESOLVE
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 3. Compilamos el proyecto para generar la carpeta 'build'
      - name: Build Project
        run: npm run build
        env:
          SKIP_PREFLIGHT_CHECK: true
          CI: false

           
      # 4. Le entregamos a Azure el proyecto ya compilado listo para publicar
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_PEBBLE_07BBBDF10 }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "build" # Azure tomará directamente lo que esté en esta carpeta
          github_id_token: ${{ steps.idtoken.outputs.result }}
          skip_app_build: true # ¡ESTO EVITA QUE AZURE INTENTE INSTALAR OTRA VEZ!

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_PEBBLE_07BBBDF10 }}
          action: "close"
